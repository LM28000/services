services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    tty: true
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      # données relocalisées depuis le chemin typo /docker/servives/ollama
      - /docker/services/ollama/ollama-data:/root/.ollama
    networks:
      - ollama_default

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3008:8080"
    environment:
      OLLAMA_BASE_URL: http://192.168.0.75:11434
      ENV: prod
      PORT: "8080"
    env_file:
      - .env
    volumes:
      # typo corrigée: /docker/service/open-webui -> /docker/services/open-webui
      - /docker/services/open-webui:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:${PORT:-8080}/health | jq -ne 'input.status == true' || exit 1"]
    depends_on:
      - ollama
    networks:
      - ollama_default

networks:
  ollama_default:
    name: ollama_default
    driver: bridge
