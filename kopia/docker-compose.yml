services:
  kopia:
    container_name: kopia
    image: kopia/kopia:latest
    restart: unless-stopped
    # COMMANDE CORRIGÉE : Kopia refuse `--without-password` sur une adresse
    # non-loopback. On garde --insecure + --address mais on active l'auth serveur
    # via --server-username / --server-password (interpolé depuis .env).
    command:
      - server
      - start
      - --insecure
      - --address=0.0.0.0:8200
      - --server-username=admin
      - --server-password=${KOPIA_SERVER_PASSWORD}
    env_file: .env
    environment:
      TZ: Europe/Paris
      RCLONE_CONFIG: /app/config/rclone.conf
      KOPIA_CONFIG_PATH: /app/config/repository.config
      KOPIA_LOG_DIR: /app/logs
      KOPIA_CACHE_DIRECTORY: /app/cache
      KOPIA_PERSIST_CREDENTIALS_ON_CONNECT: "false"
      KOPIA_CHECK_FOR_UPDATES: "false"
    ports:
      - "8200:8200"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
      - /docker:/data:ro
      - /home/louis/.config/rclone:/root/.config/rclone:ro
    networks:
      - default

networks:
  default:
    name: kopia_default
