services:
  authelia:
    container_name: authelia
    image: authelia/authelia:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
      X_AUTHELIA_CONFIG: /config/configuration.yml
    ports:
      - "9091:9091"
    volumes:
      # Le dossier de service entier est monté dans /config (db.sqlite3, users_database.yml,
      # secrets/, etc.), comme l'existant.
      - .:/config
      # IMPORTANT - gestion de la config Authelia (deux fichiers volontairement distincts) :
      #   * configuration.yml          = config LIVE auto-suffisante, secrets INLINE. Elle
      #                                  reste intacte pour que le conteneur en cours
      #                                  d'exécution reste sain en cas de restart (aucune
      #                                  variable AUTHELIA_* n'est requise pour la lire).
      #   * configuration.cutover.yml  = version SANS secrets (renvois AUTHELIA_* + clé via
      #                                  fichier). C'est CE fichier que ce compose monte par
      #                                  dessus /config/configuration.yml. Les secrets sont
      #                                  alors fournis par env_file: .env (+ secrets/).
      # Au cutover, démarrer ce stack injecte donc la config externalisée tout en laissant
      # le configuration.yml inline sur disque comme filet de sécurité.
      - ./configuration.cutover.yml:/config/configuration.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      start_period: 60s
    networks:
      - default

networks:
  default:
    name: authelia2_default
